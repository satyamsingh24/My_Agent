<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>My_AGENT - ATS CV Builder</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css"
  />
  <style>
    html, body { margin: 0; padding: 0; background: #141726; }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .9rem;
      font-family: Arial, Helvetica, sans-serif;
      color: #dfe3f2;
      background:
        radial-gradient(900px 420px at 12% -10%, #4b4a8f33, transparent),
        radial-gradient(800px 380px at 90% 0%, #3f5a8f33, transparent),
        #141726;
      text-align: center;
      padding: 1.5rem;
      z-index: 9;
    }
    #boot h1 { margin: 0; font-size: 2rem; }
    #boot .by {
      font-size: .74rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #9298b4;
    }
    #boot p { color: #9298b4; max-width: 420px; line-height: 1.55; margin: 0; }
    #boot .bar {
      width: 220px;
      height: 6px;
      border-radius: 999px;
      background: #22273d;
      overflow: hidden;
    }
    #boot .bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(135deg, #6c6fbf, #5a7fb8);
      animation: slide 1.3s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <div id="boot">
    <h1>My_AGENT</h1>
    <div class="by">Created by Satyam Singh Bhadoriya</div>
    <div class="bar"><span></span></div>
    <p>
      Starting the app inside your browser. The first load downloads Python,
      so it can take up to a minute. PIN: <strong>6932</strong>
    </p>
  </div>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";

    mount(
      {
        requirements: ["pypdf", "reportlab", "python-docx", "openpyxl", "pillow"],
        entrypoint: "app.py",
        files: {
          "app.py": { url: "./app.py" },
          "cv_engine.py": { url: "./cv_engine.py" },
          "ai_providers.py": { url: "./ai_providers.py" },
          "assets/owner_photo.jpg": { url: "./assets/owner_photo.jpg" },
          "profile/Satyam_Dev_Resume_ATS.pdf": {
            url: "./profile/Satyam_Dev_Resume_ATS.pdf",
          },
        },
        streamlitConfig: {
          "theme.base": "dark",
          "client.toolbarMode": "viewer",
          "browser.gatherUsageStats": false,
        },
      },
      document.getElementById("root"),
    );

    const boot = document.getElementById("boot");
    const root = document.getElementById("root");
    const observer = new MutationObserver(() => {
      if (root.querySelector('[data-testid="stApp"], .stApp')) {
        boot.style.display = "none";
        observer.disconnect();
      }
    });
    observer.observe(root, { childList: true, subtree: true });
  </script>
</body>
</html>
